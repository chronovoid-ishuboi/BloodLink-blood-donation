<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>BloodLink Map</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>

    <!-- CRITICAL: Disable 3D transforms BEFORE leaflet.js loads to fix WebKit/JavaFX tile tearing and fragmentation during zooming -->
    <script>
        window.L_DISABLE_3D = true;
    </script>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f7fbfa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #map {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            height: 100%;
            width: 100%;
            background: #e7eeec;
        }

        /* Prevent tile tearing, jagged fractional rendering, and flickering in JavaFX WebView */
        .leaflet-tile {
            opacity: 1 !important;
            transition: none !important;
            -webkit-transition: none !important;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            image-rendering: -webkit-optimize-contrast;
            outline: 1px solid transparent;
        }
        .leaflet-tile-container {
            -webkit-transform: none !important;
            transform: none !important;
        }
        .leaflet-zoom-animated {
            -webkit-transition: none !important;
            transition: none !important;
        }
        .leaflet-tile-container img {
            box-shadow: 0 0 1px rgba(0, 0, 0, 0.05);
        }

        /* Custom map popup styles */
        .leaflet-popup-content-wrapper {
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(20, 62, 68, 0.15);
            padding: 2px;
        }
        .leaflet-popup-content {
            margin: 12px;
            line-height: 1.4;
        }
        .popup-title {
            font-weight: 700;
            color: #164e54;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .popup-subtitle {
            color: #6f8387;
            font-size: 12px;
        }
        .popup-badge {
            display: inline-block;
            background-color: #dce9e6;
            color: #113d42;
            padding: 2px 6px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        var map = L.map('map', {
            fadeAnimation: false,
            zoomAnimation: false,
            markerZoomAnimation: false,
            zoomSnap: 1,
            zoomDelta: 1,
            wheelPxPerZoomLevel: 120,
            preferCanvas: true
        }).setView([23.8103, 90.4125], 7); // Default to Bangladesh

        var tileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap',
            updateWhenZooming: false,
            updateWhenIdle: true,
            keepBuffer: 3
        }).addTo(map);

        var markers = [];

        function resizeMap() {
            if (map) {
                map.invalidateSize({ animate: false, pan: false });
            }
        }

        // Automatic resize handling across all possible layout lifecycle events
        window.addEventListener('resize', resizeMap);
        window.addEventListener('load', resizeMap);

        if (window.ResizeObserver) {
            try {
                var ro = new ResizeObserver(function() {
                    resizeMap();
                });
                ro.observe(document.getElementById('map'));
                ro.observe(document.body);
            } catch (e) {}
        }

        // Staggered checks right after initialization to adjust as WebView finishes sizing
        setTimeout(resizeMap, 50);
        setTimeout(resizeMap, 150);
        setTimeout(resizeMap, 300);
        setTimeout(resizeMap, 600);
        setTimeout(resizeMap, 1200);

        // Stabilize tiles after zoom or move
        map.on('zoomend moveend', function() {
            setTimeout(function() {
                if (map) map.invalidateSize({ animate: false });
            }, 30);
        });

        // Will be called by Java
        function clearMarkers() {
            if (!map) return;
            resizeMap();
            for (var i = 0; i < markers.length; i++) {
                map.removeLayer(markers[i]);
            }
            markers = [];
        }

        // Will be called by Java
        function addMarker(lat, lng, title, subtitle, badgeText) {
            if (!map) return;
            resizeMap();
            var marker = L.marker([lat, lng]).addTo(map);
            
            var popupContent = '<div class="popup-title">' + title + '</div>';
            if (subtitle) {
                popupContent += '<div class="popup-subtitle">' + subtitle + '</div>';
            }
            if (badgeText) {
                popupContent += '<div class="popup-badge">' + badgeText + '</div>';
            }
            
            marker.bindPopup(popupContent);
            markers.push(marker);
        }

        // Will be called by Java
        function fitBounds() {
            if (!map) return;
            resizeMap();
            if (markers.length === 0) return;
            var group = new L.featureGroup(markers);
            map.fitBounds(group.getBounds().pad(0.15), { animate: false });
        }

        // Will be called by Java
        function setView(lat, lng, zoom) {
            if (!map) return;
            resizeMap();
            map.setView([lat, lng], zoom, { animate: false });
        }
    </script>
</body>
</html>
