# BloodLink configuration. Every value supports ${ENV_VAR:default} -- if the
# environment variable is set, it wins; otherwise the default after the colon
# is used. This exact pattern is enforced by AppConfig.java's ENV_PATTERN regex.

db.url=${DB_URL:jdbc:mysql://bloodlink-db-sunbimhaqueniloy-4a1d.b.aivencloud.com:10391/defaultdb?sslMode=REQUIRED&serverTimezone=UTC}
db.username=${DB_USERNAME:avnadmin}
db.password=${DB_PASSWORD:}

ui.auto-refresh-seconds=${UI_AUTO_REFRESH_SECONDS:10}

# Push server (see com.bloodlink.push.PushServer). Optional: if this process
# isn't running, PushClient fails silently and every dashboard's periodic
# poll above keeps the app correct regardless.
push.host=${PUSH_HOST:localhost}
push.port=${PUSH_PORT:8887}

gemini.api.key=${GEMINI_API_KEY:}
# Model used for AI-assisted NID scanning. Google retires and renames these on
# their own schedule, and a stale id fails with a 404 that looks just like a bad
# API key, so it lives here rather than in Java. If scanning starts reporting
# "Google API Error", check this value against the current model list before
# suspecting your key. Leaving gemini.api.key blank disables this path entirely
# and NidScanDialog falls back to local Tesseract.
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}

# Optional. With a Google Geolocation API key here, "detect my current
# location" can use WiFi trilateration the way a browser does. Left blank,
# the app says so rather than substituting a city-level IP guess that lands
# tens of km away -- no free provider has coverage for this region (BeaconDB
# was queried with real nearby access points and returned no estimate).
google.geolocation.api.key=${GOOGLE_GEOLOCATION_API_KEY:}
